<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw Research Workflow Handbook</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ee;
        --bg-accent: #efe8d8;
        --panel: rgba(255, 252, 246, 0.92);
        --panel-strong: #fffaf0;
        --text: #1f1a14;
        --muted: #655a4c;
        --line: rgba(111, 94, 65, 0.18);
        --brand: #8e4b21;
        --brand-soft: #c9833a;
        --green: #295d3a;
        --amber: #9a6811;
        --red: #8d2f2f;
        --shadow: 0 18px 48px rgba(78, 56, 25, 0.12);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        background:
          radial-gradient(circle at top left, rgba(201, 131, 58, 0.16), transparent 34%),
          radial-gradient(circle at top right, rgba(41, 93, 58, 0.12), transparent 28%),
          linear-gradient(180deg, #f8f3e8 0%, #f3efe6 48%, #efebe0 100%);
        color: var(--text);
      }

      a {
        color: var(--brand);
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 20px 56px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(255, 250, 240, 0.94), rgba(247, 238, 221, 0.95));
        border: 1px solid rgba(142, 75, 33, 0.14);
        border-radius: 30px;
        padding: 28px;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -60px -80px auto;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(201, 131, 58, 0.26), transparent 70%);
        pointer-events: none;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 24px;
        flex-wrap: wrap;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(142, 75, 33, 0.08);
        color: var(--brand);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .title {
        margin: 16px 0 12px;
        font-size: clamp(2rem, 4vw, 3.9rem);
        line-height: 0.98;
        max-width: 760px;
      }

      .subtitle {
        max-width: 740px;
        margin: 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.65;
      }

      .lang-toggle {
        display: inline-flex;
        gap: 8px;
        padding: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(142, 75, 33, 0.14);
      }

      .lang-toggle button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }

      .lang-toggle button.active {
        background: var(--brand);
        color: #fff9f2;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .hero-stat {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(142, 75, 33, 0.1);
        border-radius: 18px;
        padding: 16px;
      }

      .hero-stat strong {
        display: block;
        font-size: 1.7rem;
        line-height: 1;
        margin-bottom: 8px;
      }

      .hero-stat span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 290px minmax(0, 1fr);
        gap: 22px;
        margin-top: 24px;
      }

      .sidebar,
      .section,
      .timeline-card,
      .info-card,
      .agent-card,
      .command-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .sidebar {
        position: sticky;
        top: 20px;
        align-self: start;
        padding: 18px;
      }

      .sidebar h2 {
        font-size: 0.98rem;
        margin: 0 0 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--brand);
      }

      .sidebar nav {
        display: grid;
        gap: 10px;
      }

      .sidebar a {
        text-decoration: none;
        color: var(--text);
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid transparent;
      }

      .sidebar a:hover {
        border-color: rgba(142, 75, 33, 0.18);
        background: #fffdf7;
      }

      .content {
        display: grid;
        gap: 20px;
      }

      .section {
        padding: 22px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .section-header h2 {
        margin: 0;
        font-size: 1.45rem;
      }

      .section-header p {
        margin: 6px 0 0;
        color: var(--muted);
        max-width: 760px;
        line-height: 1.6;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(142, 75, 33, 0.08);
        color: var(--brand);
        font-size: 0.92rem;
      }

      .cards-2,
      .cards-3,
      .cards-4 {
        display: grid;
        gap: 14px;
      }

      .cards-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cards-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .cards-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .info-card,
      .agent-card,
      .command-card,
      .timeline-card {
        padding: 18px;
      }

      .info-card h3,
      .agent-card h3,
      .command-card h3,
      .timeline-card h3 {
        margin: 0 0 10px;
        font-size: 1.05rem;
      }

      .info-card p,
      .agent-card p,
      .command-card p,
      .timeline-card p,
      .timeline-card li,
      .info-card li {
        color: var(--muted);
        line-height: 1.62;
      }

      .timeline {
        display: grid;
        gap: 14px;
      }

      .timeline-card {
        position: relative;
        background: linear-gradient(180deg, rgba(255, 252, 247, 0.96), rgba(250, 246, 238, 0.95));
      }

      .timeline-card::before {
        content: attr(data-step);
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(142, 75, 33, 0.46);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
        margin-bottom: 12px;
      }

      .badge.auto {
        background: rgba(41, 93, 58, 0.1);
        color: var(--green);
      }

      .badge.manual {
        background: rgba(141, 47, 47, 0.1);
        color: var(--red);
      }

      .badge.mixed {
        background: rgba(154, 104, 17, 0.12);
        color: var(--amber);
      }

      .list {
        margin: 0;
        padding-left: 18px;
      }

      .matrix {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid var(--line);
      }

      .matrix th,
      .matrix td {
        padding: 14px 12px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }

      .matrix th {
        background: rgba(142, 75, 33, 0.08);
        color: var(--brand);
        font-size: 0.92rem;
      }

      .matrix tr:last-child td {
        border-bottom: 0;
      }

      .footer-note {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(142, 75, 33, 0.06);
        color: var(--muted);
        line-height: 1.65;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .links a {
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
      }

      @media (max-width: 1080px) {
        .hero-grid,
        .cards-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .cards-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: 16px 14px 42px;
        }

        .hero,
        .section {
          padding: 18px;
        }

        .hero-grid,
        .cards-2,
        .cards-3,
        .cards-4 {
          grid-template-columns: 1fr;
        }

        .title {
          font-size: 2.2rem;
        }
      }
    </style>
  </head>

      let currentLang = "en";

      function getValue(path, lang = currentLang) {
        return path.split(".").reduce((acc, part) => acc?.[part], dictionary[lang]);
      }

      function applyText() {
        document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const value = getValue(node.dataset.i18n);
          if (typeof value === "string") {
            node.textContent = value;
          }
        });
      }

      function renderStages() {
        const root = document.getElementById("timeline");
        root.innerHTML = "";
        getValue("stagesData").forEach((item) => {
          const card = document.createElement("article");
          card.className = "timeline-card";
          card.dataset.step = item.step;
          card.innerHTML = `
            <span class="badge ${item.badge}">${item.badgeText}</span>
            <h3>${item.title}</h3>
            <p>${item.body}</p>
          `;
          root.appendChild(card);
        });
      }

      function renderAgents() {
        const root = document.getElementById("agents-grid");
        root.innerHTML = "";
        getValue("agentsData").forEach((item) => {
          const card = document.createElement("article");
          card.className = "agent-card";
          card.innerHTML = `<h3>${item.title}</h3><p>${item.body}</p>`;
          root.appendChild(card);
        });
      }

      function renderCommands() {
        const root = document.getElementById("commands-grid");
        root.innerHTML = "";
        getValue("commandsData").forEach((item) => {
          const card = document.createElement("article");
          card.className = "command-card";
          card.innerHTML = `<h3>${item.title}</h3><p>${item.body}</p>`;
          root.appendChild(card);
        });
      }

      function renderStateTable() {
        const root = document.getElementById("state-table");
        root.innerHTML = "";
        getValue("stateData").forEach((item) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${item.file}</strong></td>
            <td>${item.role}</td>
            <td>${item.purpose}</td>
          `;
          root.appendChild(row);
        });
      }

      function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll("[data-lang-btn]").forEach((button) => {
          button.classList.toggle("active", button.dataset.langBtn === lang);
        });
        applyText();
        renderStages();
        renderAgents();
        renderCommands();
        renderStateTable();
      }

      document.querySelectorAll("[data-lang-btn]").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.langBtn));
      });

      setLanguage("en");
    </script>
  </body>
</html>
